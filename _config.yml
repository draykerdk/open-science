title: "Open science & health"
description: "Research people can examine, with care centred on the person. Open Science explores how Dk could support research and health through traceable methods, authorised data use and findings that others can examine."
remote_theme: draykerdk/drayker-theme
url: "https://science.drayker.org"
dk_kicker: "Applications"
dk_subdomain: "science.drayker.org"
dk_repo: "https://github.com/draykerdk/open-science"


# jekyll-remote-theme fetches the shared layout; jekyll-optional-front-matter lets
# README.md render without front matter; the defaults block is what actually applies
# the layout to it. Without all three, GitHub Pages serves bare converted markdown.
plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default

# The official mark, recoloured. Geometry is fixed for every project
# (DRAYKER-MARK.md §2.5); only the globe carries the scope.
dk_accent: "#A8D8FF"  # clarity: clean light, what anyone can check
