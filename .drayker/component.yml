schema_version: 1
component:
  id: openscience
  name: Open science & health
  layer: KNOWLEDGE
  artifact_type: architecture
  problem: "Science that cannot be reproduced and health data that cannot be moved are two versions of the same failure — knowledge locked inside whoever collected it."
  scope:
    - "Public description of applications on the Dk kernel."
    - "Public description of Autonomous Health: an AI health system integrated with each person's UID, Dk Personal, personal Dknowledge and devices, with AI-run clinics, investigating patterns with sufficient probability for multifactor detection, prevention and personalised, accessible treatment."
    - "Public description of non-clinical biomedical exploration, longevity, and anti-eugenic commitments."
    - "Public description of identity through UID, Situated Contextual Veto, and consent as the entry condition."
    - "Public description of professional review alongside AI diagnosis and monitoring."
    - "Public description of DFM review alongside peer review."
    - "Public description of data that belongs to the person."
    - "Public description of a verifiable record as an infrastructure hypothesis."
  non_scope:
    - "A medical service, a diagnosis, a treatment recommendation or advice of any kind today."
    - "Eugenic optimization, genetic caste stratification, or biological discrimination."
    - "A claim that any research or health application is running."
    - "Any handling of real patient data."
  dependencies:
    - dk
    - uid
    - dfmp
  implementation:
    level: none
    scope: This repository publishes a charter and open questions; nothing is implemented.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Design language may be mistaken for an available capability.
    - The absence of a specification can leave contributions without a clear target.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/open-science/issues
  source_of_truth:
    repository: https://github.com/draykerdk/open-science
    path: README.md
  last_reviewed: "2026-09-08"
